<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
<title>Token Inspector</title>
<desc>A friendly cartoon robot inspects YES, MAYBE and NO cards on a conveyor; the NO card is tilted as the joke.</desc>
<style>
text{font-family:sans-serif}
.eye{transform-box:fill-box;transform-origin:center;animation:b 3s infinite}
@keyframes b{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.stripes{stroke-dasharray:14 14;animation:m 1.2s linear infinite}
@keyframes m{to{stroke-dashoffset:-28}}
</style>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12324a"/><stop offset="1" stop-color="#071019"/></linearGradient>
</defs>
<rect width="800" height="500" fill="url(#g)"/>
<text x="400" y="58" text-anchor="middle" font-size="30" font-weight="bold" fill="#2fe6ff">Token Inspector</text>
<ellipse cx="170" cy="402" rx="95" ry="14" fill="#000" opacity=".35"/>
<g stroke="#2fe6ff" stroke-width="4" fill="none">
<line x1="85" y1="360" x2="75" y2="392"/><line x1="255" y1="360" x2="265" y2="392"/>
</g>
<g fill="#cfd8e3" stroke="#2fe6ff" stroke-width="3">
<rect x="100" y="210" width="140" height="150" rx="20"/>
<rect x="95" y="255" width="12" height="55" rx="6"/><rect x="233" y="255" width="12" height="55" rx="6"/>
</g>
<circle cx="170" cy="285" r="9" fill="#ffb020" stroke="#e6a41f" stroke-width="2"/>
<g fill="#cfd8e3" stroke="#2fe6ff" stroke-width="3">
<rect x="150" y="185" width="40" height="28" rx="8"/><rect x="95" y="120" width="150" height="72" rx="16"/>
</g>
<line x1="170" y1="120" x2="170" y2="96" stroke="#2fe6ff" stroke-width="3"/>
<circle cx="170" cy="90" r="7" fill="#ffb020"/>
<g fill="#eafcff">
<ellipse class="eye" cx="145" cy="152" rx="13" ry="16"/><ellipse class="eye" cx="195" cy="152" rx="13" ry="16"/>
</g>
<g fill="#0a1826"><circle cx="147" cy="154" r="5"/><circle cx="197" cy="154" r="5"/></g>
<path d="M150 174 Q170 190 190 174" stroke="#ffb020" stroke-width="4" fill="none" stroke-linecap="round"/>
<g fill="#8a93a0"><circle cx="160" cy="352" r="10"/><circle cx="180" cy="352" r="10"/></g>
<rect x="300" y="340" width="470" height="26" rx="13" fill="#1b2a3a" stroke="#2fe6ff" stroke-width="3"/>
<g fill="#8a93a0"><circle cx="335" cy="378" r="13"/><circle cx="470" cy="378" r="13"/><circle cx="605" cy="378" r="13"/><circle cx="740" cy="378" r="13"/></g>
<line class="stripes" x1="308" y1="353" x2="762" y2="353" stroke="#ffb020" stroke-width="4"/>
<g font-weight="bold" text-anchor="middle">
<g><rect x="330" y="292" width="84" height="46" rx="10" fill="#0e2a20" stroke="#2fe6ff" stroke-width="3"/><text x="372" y="322" font-size="20" fill="#2fe6ff">YES</text></g>
<g><rect x="455" y="292" width="84" height="46" rx="10" fill="#2a2410" stroke="#ffb020" stroke-width="3"/><text x="497" y="322" font-size="18" fill="#ffd76a">MAYBE</text></g>
<g transform="rotate(-18 630 305)"><rect x="588" y="282" width="84" height="46" rx="10" fill="#2e1414" stroke="#ff6b6b" stroke-width="3"/><text x="630" y="312" font-size="20" fill="#ff9a9a">NO</text></g>
</g>
</svg>
